name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo'yu checkout et
      - uses: actions/checkout@v4

      # 2️⃣ JDK 17 kur
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Android SDK, NDK ve CMake kur
      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1       # Gradle ile uyumlu
          components: build-tools;platform-tools;platforms;cmake;ndk

      # 4️⃣ CMake ve NDK dizinlerini PATH’e ekle
      - name: Add CMake and NDK to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_PATH

      # 5️⃣ Gradle kurulumu
      - uses: gradle/actions/setup-gradle@v3

      # 6️⃣ Gradlew dosyasına execute izni ver
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 7️⃣ Temizle ve debug APK build et
      - name: Clean and Build APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      # 8️⃣ Üretilen APK dosyalarını listeler
      - name: List generated APKs
        run: ls app/build/outputs/apk/debug/

      # 9️⃣ Üretilen APK’yı yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorisBoard-debug
          path: app/build/outputs/apk/debug/*.apk

      # 🔟 Eğer build başarısız olursa raporları yükle
      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports'
